name: "Initial"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
    
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Run deploy script'
        run: |
          chmod +x ./infra/deploy_infra.sh
          ./infra/deploy_infra.sh



